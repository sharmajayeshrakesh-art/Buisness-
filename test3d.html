<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGL Test — Aureal</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a0a; color: #f0f0f0;
      font-family: system-ui, sans-serif; overflow: hidden; }
    #status { position: fixed; top: 16px; left: 16px; right: 16px; z-index: 10;
      font-size: 15px; line-height: 1.5; }
    #status b { color: #c9a84c; }
    canvas { position: fixed; inset: 0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head>
<body>
  <div id="status">Loading…</div>
  <canvas id="c"></canvas>
  <script>
    (function () {
      var s = document.getElementById('status');
      function say(msg, ok) { s.innerHTML = msg; s.style.color = ok ? '#5fbf77' : '#ff6b6b'; }
      if (typeof THREE === 'undefined') { say('❌ Three.js did NOT load (CDN blocked by your network/host).', false); return; }
      try {
        var canvas = document.getElementById('c');
        var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
        renderer.setSize(innerWidth, innerHeight);
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
        camera.position.z = 4;
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        var dir = new THREE.DirectionalLight(0xffffff, 1.2); dir.position.set(3, 4, 5); scene.add(dir);
        var cube = new THREE.Mesh(
          new THREE.IcosahedronGeometry(1.3, 0),
          new THREE.MeshStandardMaterial({ color: 0xc9a84c, metalness: 0.4, roughness: 0.3, flatShading: true })
        );
        scene.add(cube);
        say('✅ WebGL works. You should see a spinning <b>gold crystal</b>. If it spins, the 3D engine runs fine on your device + host.', true);
        (function loop() {
          cube.rotation.x += 0.01; cube.rotation.y += 0.013;
          renderer.render(scene, camera);
          requestAnimationFrame(loop);
        })();
        addEventListener('resize', function () {
          camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        });
      } catch (e) {
        say('❌ Three.js loaded but WebGL failed to start on this device: ' + e.message, false);
      }
    })();
  </script>
</body>
</html>
